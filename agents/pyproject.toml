[project]
name = "hito-agents"
version = "0.1.0"
description = "hito 人 — the multi-agent layer: reads the game's observations, never runs at play time"
requires-python = ">=3.12"
dependencies = ["strands-agents[openai]==1.57.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hito_agents"]
